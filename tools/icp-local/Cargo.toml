[package]
name = "icp-local"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A local ICP (PocketIC) with store canisters for Epicmail's tests and staging runs"
publish = false

# Not in the relay's workspace: pocket-ic pins versions the relay cannot take.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.23"
candid = "0.10"
hex = "0.4"
ic-agent = "0.49"
pocket-ic = "=16.1.0"
rand = "0.10"
serde_json = "1"
