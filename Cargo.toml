[package]
name = "epicmail"
version = "0.1.11"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
description = "epicmail: an Epicbox-compatible relay. One binary, SQLite inside, wire-compatible with Epicbox 2.0.0/3.0.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "epicmail"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1.47", features = ["full"] }
axum = { version = "0.8", features = ["ws", "json", "tokio", "http1"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
secp256k1 = "0.33"
sha2 = "0.11"
bs58 = "0.5"
hex = "0.4"
rand = "0.10"
regex = "1"
tracing = "0.1"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
async-trait = "0.1"
parking_lot = "0.13"
clap = { version = "4", features = ["derive"] }
url = "2"
ipnet = { version = "2", features = ["serde"] }
base64 = "0.23"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
