[package]
name = "epicbox-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "An Epicbox relay: one binary, SQLite inside, wire-compatible with Epicbox 2.0.0/3.0.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "epicbox-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1.47", features = ["full"] }
axum = { version = "0.8", features = ["ws", "json", "tokio", "http1"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
secp256k1 = { version = "0.29", features = ["global-context"] }
sha2 = "0.10"
bs58 = "0.5"
hex = "0.4"
rand = "0.8"
regex = "1"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
async-trait = "0.1"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
url = "2"
ipnet = { version = "2", features = ["serde"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
