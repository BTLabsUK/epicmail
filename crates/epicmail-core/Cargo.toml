[package]
name = "epicmail-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
description = "The pure protocol rules of Epicmail: addresses, signatures, ids, post checks, limits. No I/O; builds for wasm32"
publish = false

[features]
# `secp256k1` (the C library) is what Epicmail uses. `k256` (pure Rust) is for wasm32. With both
# on, `secp256k1` does the work and `k256` is compiled for the differential tests only. With
# neither, the crate does not build.
default = ["secp256k1"]
secp256k1 = ["dep:secp256k1", "dep:hex"]
k256 = ["dep:k256"]

[dependencies]
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
secp256k1 = { version = "0.33", optional = true }
hex = { version = "0.4", optional = true, default-features = false, features = ["alloc"] }
k256 = { version = "0.14", optional = true, default-features = false, features = ["ecdsa", "alloc"] }

[dev-dependencies]
regex = "1"
