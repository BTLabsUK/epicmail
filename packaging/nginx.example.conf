# nginx in front of the relay. Put the map and the zones in http {}, the server blocks in conf.d.
# server.trusted_proxies in epicmail.toml must list this proxy (here 127.0.0.1/32).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-address limits in front of the relay's own per-prefix limits. They stop floods the relay
# does not limit (the public GET routes) or limits only after a request has reached it (new
# websocket connections, /v1 requests), which matters most on a small host where nginx, TLS and
# the relay share a few cores. Answer 429, not the default 503: set these once in http {}.
limit_req_status  429;
limit_conn_status 429;
# New websocket connections. A wallet keeps one socket for up to an hour; the burst covers a
# reconnect storm after a relay restart from one shared address.
limit_req_zone  $binary_remote_addr zone=epicmail_ws:10m  rate=10r/s;
# Open websocket connections per address; above limits.sockets_per_ip (256 per prefix).
limit_conn_zone $binary_remote_addr zone=epicmail_conn:10m;
# /health, /ready, /status.json, /.well-known/epicbox.json, /v1/info.
limit_req_zone  $binary_remote_addr zone=epicmail_get:10m rate=10r/s;
# /v1 post, pull and made. A wallet long-polls once per 25 s.
limit_req_zone  $binary_remote_addr zone=epicmail_v1:10m  rate=20r/s;

upstream epicmail {
    server 127.0.0.1:3423;
    keepalive 16;
}

server {
    listen 80;
    server_name relay.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name relay.example.org;

    ssl_certificate     /etc/letsencrypt/live/relay.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.org/privkey.pem;

    # /metrics is never public. Scrape 127.0.0.1:3423/metrics or set server.metrics_listen.
    location = /metrics { return 404; }
    location /metrics/  { return 404; }

    # Public GET routes: cheap, but the relay does not rate limit them.
    location ~ ^/(health|ready|status\.json|\.well-known/epicbox\.json|v1/info)$ {
        limit_req zone=epicmail_get burst=40 nodelay;
        proxy_pass http://epicmail;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }

    location / {
        limit_conn epicmail_conn 300;
        limit_req  zone=epicmail_ws burst=50 nodelay;
        proxy_pass http://epicmail;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        # Replace, do not append: the relay trusts this header from this proxy only.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Wallets keep a socket for up to an hour. Never shorten these.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The pull API is plain request/response with long polls up to http_api.max_wait_s (25 s).
    location /v1/ {
        limit_req zone=epicmail_v1 burst=40 nodelay;
        proxy_pass http://epicmail;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 40s;
        proxy_buffering off;
    }
}

# Behind a Tor onion service every client arrives from the same local address: list that
# address in limits.shared_sources, or all onion users share one client's limits. The nginx
# zones above key on $binary_remote_addr, so do the same there: key them on an empty string for
# that address (a map), or give the onion its own server block with its own limits.
