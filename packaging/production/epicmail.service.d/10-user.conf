# /etc/systemd/system/epicmail.service.d/10-user.conf: run the relay as a fixed system user
# instead of the unit's DynamicUser=yes.
#
# DynamicUser is the safer default and needs no account. A fixed user is worth it when other
# things on the host work with the relay's files under a stable owner: a backup job that runs
# `sqlite3 .backup` as that user, a log shipper reading /var/log/epicmail, or permissions and
# ACLs you manage yourself. Create the user first:
#
#   sudo useradd --system --home-dir /var/lib/epicmail --shell /usr/sbin/nologin epicmail
#
# then `sudo systemctl daemon-reload && sudo systemctl restart epicmail`. StateDirectory= and
# LogsDirectory= in the unit still create the directories, now owned by this user, and systemd
# moves existing state out of /var/lib/private on the first start.

[Service]
DynamicUser=no
User=epicmail
Group=epicmail
