# The old relay name, next to the main server of ../nginx.example.conf. It needs its own
# certificate, unless one certificate lists both names (certbot -d relay.example.org
# -d old-relay.example.org), in which case adding the name to the main server_name is enough.
#
# Both names must behave the same, so the location blocks of the main server in
# ../nginx.example.conf (from `location = /metrics` to the end of `location /v1/`) go into
# /etc/nginx/snippets/epicmail-locations.conf, and both servers include that file.
# Add old-relay.example.org to the server_name of the port 80 redirect server as well.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name old-relay.example.org;

    ssl_certificate     /etc/letsencrypt/live/old-relay.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/old-relay.example.org/privkey.pem;

    include /etc/nginx/snippets/epicmail-locations.conf;
}
