# The Tor way in. The onion service forwards its port 443 to this loopback listener; in torrc:
#
#   HiddenServicePort 443 127.0.0.1:3443
#   HiddenServiceExportCircuitID haproxy
#
# With HiddenServiceExportCircuitID, tor starts each connection with a PROXY protocol header
# whose source address stands for the Tor circuit (fc00:dead:beef:4dad::<circuit id>). nginx
# passes that address on as X-Forwarded-For, so the relay's limits and logs tell circuits
# apart instead of seeing every Tor user as 127.0.0.1, and shared_sources in epicmail.toml
# gives the range its larger budget.
#
# The listener speaks TLS with the relay's normal certificate. A wallet keeps relay.example.org
# as its Epicbox domain and reaches it through tor (MapAddress relay.example.org <onion>), so
# addresses stay the same and a wrong onion cannot pose as the relay.
#
# Uses $connection_upgrade from ../nginx.example.conf (http context).

# Per circuit, and a cap on what all Tor clients together hold open.
limit_req_zone  $proxy_protocol_addr zone=epicmail_onion_ws:10m rate=5r/s;
limit_conn_zone $proxy_protocol_addr zone=epicmail_onion_conn:10m;
limit_conn_zone $server_port         zone=epicmail_onion_total:1m;

server {
    # Loopback only: tor is the only client.
    listen 127.0.0.1:3443 ssl proxy_protocol;
    server_name relay.example.org old-relay.example.org;

    ssl_certificate     /etc/letsencrypt/live/relay.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.org/privkey.pem;

    location = /metrics { return 404; }
    location /metrics/  { return 404; }

    location / {
        limit_conn epicmail_onion_conn 8;
        # Backstop only: the relay's per-prefix limits times shared_multiplier do the limiting, and
        # wallets hold a socket for up to an hour.
        limit_conn epicmail_onion_total 4096;
        limit_req  zone=epicmail_onion_ws burst=10 nodelay;

        proxy_pass http://127.0.0.1:3423;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        # The circuit, not the loopback peer.
        proxy_set_header X-Forwarded-For   $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Wallets keep a socket for up to an hour, over Tor as anywhere else.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
