name: release

# A version tag (v1.2.3) builds static musl binaries for x86_64 and aarch64, publishes them as a
# GitHub release with SHA256SUMS and build provenance attestations, then installs that release
# with the one-line tools/get.sh on fresh x86_64 and aarch64 runners.
# A push to a ci/* branch runs the same build and install test and publishes nothing.

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools file
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Build
        run: tools/build-static.sh "$ARCH"
      - name: Check the version against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          got=$("target/$ARCH-unknown-linux-musl/release/epicmail" --version)
          want="epicmail ${GITHUB_REF_NAME#v}"
          [ "$got" = "$want" ] || { echo "the binary says '$got', the tag says '$want'"; exit 1; }
      - name: Stage
        run: |
          mkdir dist
          cp "target/$ARCH-unknown-linux-musl/release/epicmail" "dist/epicmail-$ARCH-linux-musl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  dist:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Release files and SHA256SUMS
        run: |
          cp tools/install.sh packaging/epicmail.service packaging/epicmail.example.toml dist/
          cd dist
          sha256sum epicmail-* install.sh epicmail.service epicmail.example.toml > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          Static Linux binaries (musl) for x86_64 and aarch64, and the files \`tools/get.sh\` installs.

          Install or upgrade a relay with TLS through Caddy:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/tools/get.sh | sh -s -- --version $TAG --domain relay.example.org
          \`\`\`

          Check a download by hand:

          \`\`\`sh
          sha256sum -c --ignore-missing SHA256SUMS
          gh attestation verify epicmail-x86_64-linux-musl --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --verify-tag --title "epicmail ${TAG#v}" \
              --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi

  install-test:
    name: install test ${{ matrix.arch }}
    needs: [dist, release]
    if: ${{ !cancelled() && needs.dist.result == 'success' && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install test
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: .github/install-test.sh
